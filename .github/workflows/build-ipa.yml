name: Build NContainer IPA

on:
  push:
    branches: [main, master]
    paths:
      - "LiveContainer/**"
      - "LiveContainerSwiftUI/**"
      - "LiveContainer.xcodeproj/**"
      - "xcconfigs/**"
      - ".github/build_github.sh"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Archive unsigned app
        run: |
          set -euxo pipefail
          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -archivePath "$archive_path.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM=''

      - name: Package IPA with embedded SideStore
        run: |
          set -euxo pipefail
          bash .github/build_github.sh
          test -f "${scheme}.ipa"
          test -f "${scheme}+SideStore.ipa"
          unzip -t "${scheme}+SideStore.ipa"
          APP_INFO="Payload/LiveContainer.app/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")
          IPA_SIZE=$(stat -f%z "${scheme}+SideStore.ipa")
          IPA_SHA256=$(shasum -a 256 "${scheme}+SideStore.ipa" | awk '{print $1}')
          SIDESTORE_SIZE=$(stat -f%z "${scheme}.ipa")
          SIDESTORE_SHA256=$(shasum -a 256 "${scheme}.ipa" | awk '{print $1}')
          {
            echo "IPA_VERSION=${VERSION}"
            echo "IPA_BUILD=${BUILD}"
            echo "IPA_SIZE=${IPA_SIZE}"
            echo "IPA_SHA256=${IPA_SHA256}"
            echo "SIDESTORE_SIZE=${SIDESTORE_SIZE}"
            echo "SIDESTORE_SHA256=${SIDESTORE_SHA256}"
          } >> "$GITHUB_ENV"

      - name: Write build details
        run: |
          cat > build-summary.md <<EOF
          # NContainer IPA

          - SideStore embedded: `${scheme}+SideStore.ipa`
          - Standard: `${scheme}.ipa`
          - Version: `${IPA_VERSION}`
          - Build: `${IPA_BUILD}`
          - SideStore IPA size: `${IPA_SIZE}` bytes
          - SideStore IPA SHA-256: `${IPA_SHA256}`
          - Standard IPA size: `${SIDESTORE_SIZE}` bytes
          - Standard IPA SHA-256: `${SIDESTORE_SHA256}`
          - Signing: unsigned
          EOF

      - name: Publish public IPA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_id }}"
          name: "NContainer build ${{ github.run_number }} (SideStore embedded)"
          prerelease: true
          body_path: build-summary.md
          files: |
            ${{ env.scheme }}.ipa
            ${{ env.scheme }}+SideStore.ipa

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NContainer-IPA
          path: |
            ${{ env.scheme }}.ipa
            ${{ env.scheme }}+SideStore.ipa
            build-summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "## NContainer IPA ✅"
            echo ""
            echo "### Download"
            echo ""
            echo "[⬇️ Download SideStore embedded IPA](https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_id }}/${scheme}%2BSideStore.ipa)"
            echo ""
            echo "[⬇️ Download standard IPA](https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_id }}/${scheme}.ipa)"
            echo ""
            echo "### Build details"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| SideStore embedded | \`${scheme}+SideStore.ipa\` |"
            echo "| Version | \`${IPA_VERSION}\` |"
            echo "| Build | \`${IPA_BUILD}\` |"
            echo "| SideStore IPA size | \`${IPA_SIZE}\` bytes |"
            echo "| SideStore IPA SHA-256 | \`${IPA_SHA256}\` |"
            echo "| Standard IPA size | \`${SIDESTORE_SIZE}\` bytes |"
            echo "| Standard IPA SHA-256 | \`${SIDESTORE_SHA256}\` |"
            echo "| Signing | unsigned |"
          } >> "$GITHUB_STEP_SUMMARY"
