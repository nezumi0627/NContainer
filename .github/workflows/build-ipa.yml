name: Build NContainer IPA

on:
  push:
    branches: [main, master]
    paths:
      - "LiveContainer/**"
      - "LiveContainerSwiftUI/**"
      - "LiveContainer.xcodeproj/**"
      - "xcconfigs/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Build unsigned app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP_PATH=$(find DerivedData/Build/Products -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          APP_NAME=$(basename "$APP_PATH" .app)
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "${APP_NAME}-v${VERSION}-build${BUILD}.ipa"
          unzip -t "${APP_NAME}-v${VERSION}-build${BUILD}.ipa"
          SIZE=$(stat -f%z "${APP_NAME}-v${VERSION}-build${BUILD}.ipa")
          SHA256=$(shasum -a 256 "${APP_NAME}-v${VERSION}-build${BUILD}.ipa" | awk '{print $1}')
          echo "IPA_NAME=${APP_NAME}-v${VERSION}-build${BUILD}.ipa" >> "$GITHUB_ENV"
          echo "IPA_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IPA_BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "IPA_SIZE=${SIZE}" >> "$GITHUB_ENV"
          echo "IPA_SHA256=${SHA256}" >> "$GITHUB_ENV"

      - name: Write build details
        run: |
          cat > build-summary.md <<EOF
          # NContainer IPA

          - File: `${IPA_NAME}`
          - Version: `${IPA_VERSION}`
          - Build: `${IPA_BUILD}`
          - Size: `${IPA_SIZE}` bytes
          - SHA-256: `${IPA_SHA256}`
          - Signing: unsigned
          EOF

      - name: Publish public IPA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_id }}"
          name: "NContainer build ${{ github.run_number }}"
          prerelease: true
          body_path: build-summary.md
          files: ${{ env.IPA_NAME }}

      - name: Upload IPA artifact
        id: upload_ipa
        uses: actions/upload-artifact@v4
        with:
          name: NContainer-IPA
          path: |
            ${{ env.IPA_NAME }}
            build-summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "## NContainer IPA ✅"
            echo ""
            echo "### Download"
            echo ""
            echo "[⬇️ Download IPA](https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_id }}/${IPA_NAME})"
            echo ""
            echo "[Actions artifact (requires GitHub login)](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "### Build details"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| File | \`${IPA_NAME}\` |"
            echo "| Version | \`${IPA_VERSION}\` |"
            echo "| Build | \`${IPA_BUILD}\` |"
            echo "| Size | \`${IPA_SIZE}\` bytes |"
            echo "| SHA-256 | \`${IPA_SHA256}\` |"
            echo "| Signing | unsigned |"
          } >> "$GITHUB_STEP_SUMMARY"
